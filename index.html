<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardfall</title>
<style>
:root {
  --bg: #12151a; --panel: #1c222b; --panel2: #262e3a; --line: #3a4554; --text: #e8e4da; --dim: #9aa3ad;
  --amber: #ffb347; --amber2: #e08a1e; --hp: #e5534b; --xp: #c78bff; --ap: #5aa0ff; --mp: #5fd08a; --good: #7dff9a; --bad: #ff7a6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; }
body { display: flex; justify-content: center; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { width: min(100vw, calc((100vh - 86px) * 960 / 560)); min-width: 320px; display: flex; flex-direction: column; }
#stage { position: relative; width: 100%; aspect-ratio: 960 / 560; background: #000; overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; }
.chip { position: absolute; background: rgba(18,21,26,.82); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; pointer-events: none; }
#mapinfo { left: 8px; top: 8px; }
#mapinfo b { color: var(--amber); }
#mapinfo small { color: var(--dim); display: block; }
#quest { left: 8px; top: 58px; max-width: 220px; font-size: 12px; }
#quest b { color: var(--amber); }
#timeline { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 92%; }
.tl { display: flex; align-items: center; gap: 6px; background: rgba(18,21,26,.82); border: 1px solid var(--line); border-left: 4px solid #5aa0ff; border-radius: 6px; padding: 2px 8px 2px 2px; min-width: 122px; }
.tl.ally { border-left-color: #ff7a5a; }
.tl.now { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); background: rgba(60,44,20,.9); }
.tl.dead { opacity: .35; }
.tl img { width: 30px; height: 30px; }
.tl .n { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
.tl .b { height: 4px; width: 78px; background: #0d0f12; border-radius: 2px; overflow: hidden; margin-top: 2px; }
.tl .b i { display: block; height: 100%; background: var(--hp); }
#log { position: absolute; left: 8px; bottom: 8px; width: 300px; max-width: 46%; max-height: 104px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
#log div { padding: 1px 6px; background: rgba(18,21,26,.5); border-radius: 4px; margin-top: 2px; width: fit-content; max-width: 100%; }
#log .g { color: var(--good); } #log .r { color: var(--bad); } #log .a { color: var(--amber); } #log .d { color: #c8d0d8; }
#banner { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #000, 0 0 14px rgba(0,0,0,.8); letter-spacing: .5px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
#banner.on { opacity: 1; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .18s; pointer-events: none; }
#fade.on { opacity: 1; }

#bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: linear-gradient(#232a34, #181d24); border-top: 2px solid var(--amber2); min-height: 86px; flex-wrap: wrap; }
#who { display: flex; align-items: center; gap: 8px; }
#who img { width: 46px; height: 46px; background: var(--panel2); border: 1px solid var(--line); border-radius: 50%; }
#who b { display: block; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#who span { color: var(--amber); font-size: 12px; }
#gauges { width: 170px; display: flex; flex-direction: column; gap: 5px; }
.gauge { position: relative; height: 18px; background: #0d0f12; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ff7a6b, var(--hp)); transition: width .25s; }
.gauge.xp { height: 12px; } .gauge.xp i { background: linear-gradient(#dcb0ff, var(--xp)); }
.gauge span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; font-weight: 700; text-shadow: 0 1px 1px #000; }
.gauge.xp span { line-height: 10px; font-size: 9px; }
#points { display: flex; gap: 6px; }
.pt { width: 42px; height: 46px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel2); }
.pt b { font-size: 20px; line-height: 20px; } .pt small { font-size: 10px; color: var(--dim); }
.pt.ap b { color: var(--ap); } .pt.mp b { color: var(--mp); }
#spells { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; min-width: 180px; }
.sp { position: relative; width: 44px; height: 44px; padding: 0; border: 2px solid var(--line); border-radius: 8px; background: none; overflow: hidden; }
.sp img { width: 100%; height: 100%; display: block; }
.sp .c { position: absolute; right: 1px; bottom: 0; font-size: 10px; font-weight: 800; color: var(--ap); text-shadow: 0 1px 1px #000, 0 0 2px #000; }
.sp .k { position: absolute; left: 2px; top: 0; font-size: 9px; color: #fff; opacity: .7; text-shadow: 0 1px 1px #000; }
.sp .cd { position: absolute; inset: 0; background: rgba(10,12,16,.72); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
.sp.sel { border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
.sp.off { filter: grayscale(.8) brightness(.6); }
.sp:hover { border-color: #8a97a6; } .sp.sel:hover { border-color: var(--amber); }
#menu { display: flex; gap: 4px; }
#menu button { position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; }
#menu button:hover { border-color: var(--amber); }
#menu .dot { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--amber); display: none; }
#menu .has .dot { display: block; }
#act { background: linear-gradient(var(--amber), var(--amber2)); color: #20160a; border: none; border-radius: 10px; padding: 12px 16px; font-weight: 800; min-width: 104px; }
#act:disabled { filter: grayscale(1) brightness(.6); cursor: default; }
#act.hide { display: none; }

#win { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,10,13,.45); z-index: 20; padding: 10px; }
#win.on { display: flex; }
.panel { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--amber2); border-radius: 12px; box-shadow: 0 16px 50px rgba(0,0,0,.6); max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; min-width: 300px; }
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel header b { font-size: 16px; color: var(--amber); }
.panel header button { background: none; border: none; font-size: 20px; color: var(--dim); line-height: 1; }
.panel .body { padding: 12px 14px; overflow: auto; }
.row { display: flex; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kv { display: flex; justify-content: space-between; gap: 18px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.07); }
.kv span { color: var(--dim); } .kv b.up { color: var(--good); }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; }
.btn:hover:not(:disabled) { border-color: var(--amber); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: linear-gradient(var(--amber), var(--amber2)); color: #20160a; border: none; font-weight: 700; }
.btn.sm { padding: 1px 7px; font-weight: 800; }
h4 { margin: 10px 0 6px; color: var(--amber); font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
h4:first-child { margin-top: 0; }
.slots { display: grid; grid-template-columns: repeat(4, 50px); gap: 6px; }
.bag { display: grid; grid-template-columns: repeat(6, 50px); gap: 6px; align-content: start; min-height: 106px; }
.it { position: relative; width: 50px; height: 50px; border: 2px solid var(--line); border-radius: 8px; background: #151a21; padding: 0; overflow: hidden; }
.it img { width: 100%; height: 100%; display: block; }
.it.empty { display: flex; align-items: center; justify-content: center; font-size: 9px; color: #5c6672; cursor: default; }
.it .q { position: absolute; right: 2px; bottom: 0; font-size: 11px; font-weight: 800; text-shadow: 0 1px 1px #000, 0 0 2px #000; }
.it .l { position: absolute; left: 2px; top: 0; font-size: 9px; color: #ffd9a0; text-shadow: 0 1px 1px #000; }
.it.sel { border-color: var(--amber); } .it.low { opacity: .55; }
.it:hover:not(.empty) { border-color: #8a97a6; }
.detail { margin-top: 10px; padding: 10px; background: #151a21; border: 1px solid var(--line); border-radius: 8px; min-height: 76px; }
.detail .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.iname { font-weight: 700; color: #ffe2a8; } .isub { color: var(--dim); font-size: 12px; }
.istat { color: var(--good); font-size: 13px; } .istat small { color: var(--dim); }
.iset { color: #b9a0ff; font-size: 12px; margin-top: 4px; } .iset .off { color: #6b6480; }
.gold { color: #ffd766; font-weight: 700; }
.spell { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); align-items: flex-start; }
.spell img { width: 40px; height: 40px; border-radius: 7px; }
.spell.locked { opacity: .45; }
.spell .t { flex: 1; min-width: 0; } .spell .t small { color: var(--dim); display: block; }
.pips { color: var(--amber); letter-spacing: 2px; }
.wmap { display: grid; gap: 6px; }
.wcell { width: 112px; height: 62px; border-radius: 8px; border: 1px solid var(--line); padding: 5px 7px; font-size: 11px; background: var(--panel2); }
.wcell b { display: block; font-size: 12px; } .wcell small { color: var(--dim); }
.wcell.here { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.wcell.none { visibility: hidden; }
.loot { display: flex; flex-wrap: wrap; gap: 6px; }
.big { font-size: 22px; font-weight: 800; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--amber); }
input[type=text] { background: #0f1318; border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 8px 10px; font: inherit; width: 100%; user-select: text; -webkit-user-select: text; }
#tip { position: fixed; z-index: 40; pointer-events: none; display: none; background: rgba(16,19,24,.97); border: 1px solid var(--amber2); border-radius: 8px; padding: 8px 10px; max-width: 260px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#tip .iname { font-size: 14px; }
@media (max-width: 720px) {
  #bar { gap: 6px; padding: 6px; }
  #gauges { width: 120px; }
  .bag { grid-template-columns: repeat(5, 50px); }
  .grid2 { grid-template-columns: 1fr; }
  #timeline .n { display: none; } .tl { min-width: 0; padding-right: 4px; } .tl .b { width: 30px; }
  .wcell { width: 76px; height: 58px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="960" height="560"></canvas>
    <div id="mapinfo" class="chip"></div>
    <div id="quest" class="chip"></div>
    <div id="timeline"></div>
    <div id="log"></div>
    <div id="banner"></div>
    <div id="fade"></div>
  </div>
  <div id="bar">
    <div id="who"><img id="face" alt=""><div><b id="name"></b><span id="lvl"></span></div></div>
    <div id="gauges">
      <div class="gauge hp"><i id="hpfill"></i><span id="hptext"></span></div>
      <div class="gauge xp"><i id="xpfill"></i><span id="xptext"></span></div>
    </div>
    <div id="points">
      <div class="pt ap"><b id="apv">6</b><small>AP</small></div>
      <div class="pt mp"><b id="mpv">3</b><small>MP</small></div>
    </div>
    <div id="spells"></div>
    <div id="menu">
      <button data-win="char" title="Characteristics (C)">Stats<i class="dot"></i></button>
      <button data-win="bag" title="Inventory (I)">Bag<i class="dot"></i></button>
      <button data-win="spells" title="Spells (S)">Spells<i class="dot"></i></button>
      <button data-win="map" title="World map (M)">Map</button>
    </div>
    <button id="act" class="hide">End turn</button>
  </div>
</div>
<div id="win"></div>
<div id="tip"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
