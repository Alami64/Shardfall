<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shardfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  /* Layout: the map canvas fills the screen; a placard (top left), a tile readout (top right)
     and a control bar (bottom) float over it like a field guide's margin notes.
     One deliberate dark look, matched to the canvas, in every theme. */
  :root {
    --night: #0f1a14;
    --panel: rgba(14, 25, 19, 0.82);
    --line: rgba(239, 230, 207, 0.16);
    --parchment: #efe6cf;
    --moss: #a9b89f;
    --amber: #f2a541;
    --teal: #3fc1b0;
    --ember: #e8704f;
    --team-a: #5aa9e6;
    --team-b: #e0533d;
    --heal: #7fd47a;
    --font-display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
    --font-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gap: 12px;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.4;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; height: 100%; overflow: hidden; }
  #game { position: absolute; inset: 0; }
  #game canvas { display: block; touch-action: none; }

  .hud {
    position: absolute;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .placard {
    top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    left: calc(var(--gap) + env(safe-area-inset-left, 0px));
    padding: 10px 16px 12px;
    max-width: min(320px, calc(100% - 2 * var(--gap)));
  }
  .eyebrow {
    margin: 0;
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moss);
  }
  .eyebrow .coords { font-family: var(--font-data); letter-spacing: 0; text-transform: none; color: var(--amber); }
  .placard h1 {
    margin: 2px 0 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .readout {
    top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    right: calc(var(--gap) + env(safe-area-inset-right, 0px));
    padding: 10px 14px;
    min-width: 200px;
    display: grid;
    gap: 4px;
  }
  .readout dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .readout dt { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--moss); }
  .readout dd { margin: 0; font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
  .readout .status { margin: 4px 0 0; font-size: 14px; }
  .readout .exit { margin: 0; font-size: 14px; color: var(--amber); font-weight: 500; }
  .readout .group { margin: 0; font-size: 14px; color: var(--ember); font-weight: 500; }

  .controls {
    bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: calc(100% - 2 * var(--gap));
  }
  .controls .hint { margin: 0 8px 0 6px; font-size: 14px; color: var(--moss); }
  .controls button {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 6px;
    font: 500 14px/1 var(--font-body);
    color: var(--parchment);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .controls button:hover { background: rgba(239, 230, 207, 0.07); }
  .controls button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { border-color: var(--amber); background: rgba(242, 165, 65, 0.14); }
  .controls button[aria-pressed="true"] kbd { background: var(--amber); color: var(--night); }
  kbd {
    display: inline-grid;
    place-items: center;
    min-width: 22px;
    height: 22px;
    font: 500 12px/1 var(--font-data);
    color: var(--parchment);
    background: rgba(239, 230, 207, 0.1);
    border-radius: 5px;
  }
  .swatch { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); }
  .swatch.range { background: var(--teal); }

  /* ---------------------------------------------------------------- fight */
  .fight-top {
    top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100% - 2 * var(--gap) - 360px);
  }
  .fight-status { margin: 0; display: grid; gap: 2px; justify-items: center; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--moss); white-space: nowrap; }
  .fight-status .timer { font: 500 15px/1 var(--font-data); color: var(--parchment); letter-spacing: 0; }
  .fight-status .timer.low { color: var(--ember); }
  .timeline { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; }
  .chip {
    display: grid;
    gap: 4px;
    min-width: 82px;
    padding: 5px 8px 6px;
    border-radius: 7px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--team-a);
    background: rgba(239, 230, 207, 0.04);
  }
  .chip.team-B { border-top-color: var(--team-b); }
  .chip.active { border-color: var(--amber); background: rgba(242, 165, 65, 0.16); }
  .chip.down { opacity: 0.35; }
  .chip-name { font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .chip-hp, .hpbar { display: block; height: 4px; border-radius: 2px; background: rgba(239, 230, 207, 0.15); overflow: hidden; }
  .chip-hp span, .hpbar span { display: block; height: 100%; background: var(--heal); transition: width 200ms ease; }
  .chip.team-B .chip-hp span { background: var(--team-b); }

  .fight-log {
    top: calc(92px + var(--gap) + env(safe-area-inset-top, 0px));
    right: calc(var(--gap) + env(safe-area-inset-right, 0px));
    width: 280px;
    max-height: 40vh;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 13px;
    pointer-events: auto;
  }
  .fight-log p { margin: 0 0 3px; }
  .fight-log .log-turn { margin-top: 6px; color: var(--amber); font-family: var(--font-display); font-size: 14px; }
  .fight-log .log-hit { color: #f2b8a8; }
  .fight-log .log-heal { color: var(--heal); }
  .fight-log .log-info { color: var(--moss); }

  .fight-bar {
    bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: max-content;
    max-width: calc(100% - 2 * var(--gap));
  }
  .fighter-card { min-width: 170px; padding: 2px 6px; border-left: 3px solid var(--team-a); }
  .fighter-card.team-B { border-left-color: var(--team-b); }
  .fc-name { margin: 0 0 4px; font-family: var(--font-display); font-size: 17px; line-height: 1.1; }
  .fc-stats { margin: 4px 0 0; font: 13px/1.2 var(--font-data); }
  .fc-stats b { color: var(--amber); font-weight: 500; }
  .fc-notes { margin: 2px 0 0; font-size: 12.5px; color: var(--moss); max-width: 220px; }
  .fc-notes:empty { display: none; }
  .spellbar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .actions { display: flex; gap: 6px; }
  .fight-bar button {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 6px;
    font: 500 14px/1 var(--font-body);
    color: var(--parchment);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease, opacity 120ms ease;
  }
  .fight-bar button:hover:not(:disabled) { background: rgba(239, 230, 207, 0.07); }
  .fight-bar button:focus-visible, .result-card button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .fight-bar button:disabled { opacity: 0.38; cursor: not-allowed; }
  .fight-bar button.primary { border-color: rgba(242, 165, 65, 0.6); }
  .spell { flex-direction: column; align-items: stretch !important; gap: 3px !important; padding: 5px 8px !important; min-width: 92px; text-align: left; }
  .spell kbd { min-width: 18px; height: 18px; font-size: 11px; }
  .spell .spell-name { font-size: 13.5px; }
  .spell .spell-cost { font: 12px/1 var(--font-data); color: var(--teal); }
  .spell[aria-pressed="true"] { border-color: var(--teal); background: rgba(63, 193, 176, 0.16); }
  .fight-hint { flex-basis: 100%; margin: 0; text-align: center; font-size: 13.5px; color: var(--moss); }
  .fight-hint:empty { display: none; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: calc(150px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 8px);
    padding: 6px 14px;
    border-radius: 8px;
    background: rgba(224, 83, 61, 0.92);
    color: #fff;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    transition: opacity 150ms ease, transform 150ms ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .result { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 14, 10, 0.45); }
  .result-card { position: static; padding: 22px 28px 24px; text-align: center; max-width: min(380px, calc(100% - 2 * var(--gap))); pointer-events: auto; }
  .result-card h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 30px; color: var(--amber); }
  .result-card p { margin: 0 0 16px; color: var(--parchment); }
  .result-card button { padding: 8px 16px; font: 500 15px/1 var(--font-body); color: var(--night); background: var(--amber); border: 0; border-radius: 7px; cursor: pointer; }

  @media (max-width: 960px) {
    .fight-top { left: var(--gap); transform: none; max-width: calc(100% - 2 * var(--gap)); top: calc(78px + var(--gap)); }
    .fight-log { display: none; }
  }

  @media (max-width: 720px) {
    .placard h1 { font-size: 21px; }
    .readout { top: auto; bottom: calc(64px + var(--gap) + env(safe-area-inset-bottom, 0px)); min-width: 0; }
    .controls .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .controls button, .fight-bar button, .toast, .chip-hp span, .hpbar span { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="game" aria-label="Map view: click or tap a tile to walk there"></div>

  <header class="hud placard">
    <p class="eyebrow"><span id="map-region">Brightmoor Isle</span><span class="coords" id="map-coords">[0, 0]</span></p>
    <h1 id="map-name">Brightmoor Meadow</h1>
  </header>

  <div id="explore-hud">
  <aside class="hud readout" id="cell-info" hidden aria-live="polite">
    <dl>
      <dt>Cell</dt><dd id="cell-id">0</dd>
      <dt>Grid</dt><dd id="cell-grid">0, 0</dd>
    </dl>
    <p class="status" id="cell-status">Walkable</p>
    <p class="exit" id="cell-exit" hidden></p>
    <p class="group" id="cell-group" hidden></p>
  </aside>

  <nav class="hud controls" aria-label="Map tools">
    <p class="hint">Click a tile to walk · click the monsters to fight · the amber edge leads on</p>
    <button type="button" id="btn-range" aria-pressed="false"><kbd>R</kbd>3 MP range</button>
    <button type="button" id="btn-debug" aria-pressed="false"><kbd>D</kbd>Cell grid</button>
  </nav>
  </div>

  <div id="fight-hud" hidden>
    <div class="hud fight-top">
      <p class="fight-status"><span id="fight-round">Placement</span><span class="timer" id="fight-timer"></span></p>
      <ol class="timeline" id="fight-timeline" aria-label="Turn order"></ol>
    </div>

    <aside class="hud fight-log" id="fight-log" aria-live="polite" aria-label="Fight log"></aside>

    <section class="hud fight-bar" aria-label="Fight controls">
      <div class="fighter-card" id="fighter-card" hidden>
        <p class="fc-name" id="fc-name"></p>
        <div class="hpbar"><span id="fc-hp-fill"></span></div>
        <p class="fc-stats"><span id="fc-hp"></span> HP · <b id="fc-ap"></b> AP · <b id="fc-mp"></b> MP</p>
        <p class="fc-notes" id="fc-notes"></p>
      </div>
      <div class="spellbar" id="spellbar" hidden></div>
      <div class="actions">
        <button type="button" id="btn-ready" class="primary"><kbd>↵</kbd>Ready</button>
        <button type="button" id="btn-end-turn" class="primary" hidden><kbd>␣</kbd>End turn</button>
        <button type="button" id="btn-flee" hidden>Flee</button>
      </div>
      <p class="fight-hint" id="fight-hint"></p>
    </section>

    <div class="toast" id="fight-toast" role="status"></div>

    <div class="result" id="fight-result" hidden>
      <div class="hud result-card" role="dialog" aria-labelledby="result-title">
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <button type="button" id="btn-result" class="primary">Back to the meadow</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
